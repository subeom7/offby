name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

      # 폰트를 다시 만들어 커밋된 것과 같은지 본다. 문구를 고치고
      # npm run fonts를 잊으면 글자가 깨진 채로 배포되는데, 브라우저에서
      # 두부 모양이 뜨기 전까지 아무도 모른다.
      #
      # index.html까지 검사 범위에 넣는다. 빌드가 폰트 파일명(내용 해시)과
      # 그걸 참조하는 @font-face를 함께 바꾸므로 둘이 어긋나면 폰트가
      # 404가 된다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fonttools brotli
      - name: 폰트가 최신인지 확인
        run: |
          python tools/build_fonts.py
          if ! git diff --quiet -- public; then
            echo "::error::index.html의 문구가 바뀌었는데 폰트를 다시 만들지 않았습니다. 'npm run fonts' 후 커밋하세요."
            git diff --stat -- public
            exit 1
          fi
          echo "폰트 최신 상태"
