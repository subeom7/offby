name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

      # 배포 산출물이 index.html과 어긋나지 않았는지 본다.
      #
      # 처음에는 폰트와 og:image를 다시 만들어 커밋된 것과 바이트 비교했다.
      # 폰트(woff2)는 그게 통했지만 og.png는 리눅스 CI와 윈도우 로컬의
      # Pillow/FreeType 빌드가 달라 래스터화 결과가 절대 같아지지 않았다.
      # 바이트 동일성은 애초에 검사하려던 대상이 아니었다 — 잡으려는 건
      # "문구를 고치고 npm run fonts 를 잊는 것"이고, 그건 글리프 커버리지로
      # 직접 확인하는 게 맞다. 재생성이 없어 폰트 다운로드도 안 한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fonttools brotli
      - run: python tools/check_assets.py
