<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정밀 타이밍 측정기</title>
<meta name="description" content="목표 시간을 눈대중으로 맞춰 보세요. 얼마나 빠르게, 혹은 늦게 누르는지 기록으로 남습니다.">
<meta name="theme-color" content="#191A1E">
<meta property="og:type" content="website">
<meta property="og:title" content="정밀 타이밍 측정기">
<meta property="og:description" content="목표 시간을 눈대중으로 맞춰 보세요. 얼마나 빠르게, 혹은 늦게 누르는지 기록으로 남습니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23FCF8F5'/><circle cx='16' cy='16' r='9' fill='none' stroke='%2317120F' stroke-width='2.5'/><path d='M16 10v6.5l4 2.5' stroke='%23BE3A29' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
<style>
  /* 폰트는 직접 호스팅한다. CDN을 쓰면 첫 렌더가 외부 왕복만큼 늦어지고
     방문자 IP가 그쪽으로 넘어간다. 페이지에 실제로 쓰는 글자만 남겨서
     한글 폰트도 수십 KB로 줄였다(tools/build_fonts.py). 둘 다 OFL이며
     라이선스는 fonts/OFL-*.txt에 함께 배포한다. */
  @font-face{
    font-family:"Azeret Mono";
    src:url("fonts/AzeretMono-var.810ec9ed.woff2") format("woff2");
    font-weight:100 900;      /* 가변 폰트 — 파일 하나로 400/500/700 */
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Sans KR";
    src:url("fonts/IBMPlexSansKR-Regular.81b065d9.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Sans KR";
    src:url("fonts/IBMPlexSansKR-Medium.87e458e3.woff2") format("woff2");
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:"IBM Plex Sans KR";
    src:url("fonts/IBMPlexSansKR-SemiBold.797101f5.woff2") format("woff2");
    font-weight:600; font-style:normal; font-display:swap;
  }

  :root{
    --desk:#191A1E;
    --desk-2:#232429;
    --paper:#FCF8F5;
    --grid-fine:#F4D2C8;
    --grid-bold:#E5A091;
    --ink:#17120F;
    --ink-soft:#7C716B;
    --pen-good:#0F7A6B;
    --pen-bad:#BE3A29;
    --edge:#E4D8D1;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:
      radial-gradient(120% 90% at 50% 0%, var(--desk-2) 0%, var(--desk) 62%);
    color:var(--ink);
    font-family:"IBM Plex Sans KR", system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .machine{
    width:100%;
    max-width:720px;
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 1px 0 rgba(255,255,255,.06), 0 28px 60px -20px rgba(0,0,0,.7);
    overflow:hidden;
  }

  /* ── head ─────────────────────────────── */
  .head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:16px 22px 12px;
    border-bottom:1px solid var(--edge);
  }
  .eyebrow{
    font-family:"Azeret Mono", monospace;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .rec{
    display:flex; align-items:center; gap:7px;
    font-family:"Azeret Mono", monospace;
    font-size:10px; letter-spacing:.18em;
    color:var(--ink-soft);
  }
  .rec .bulb{
    width:7px;height:7px;border-radius:50%;
    background:var(--edge);
  }
  .rec.live{color:var(--pen-bad)}
  .rec.live .bulb{background:var(--pen-bad);animation:blink .9s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.15}}

  /* ── readout ──────────────────────────── */
  .readout{padding:26px 22px 22px;text-align:center}
  .kicker{
    font-family:"Azeret Mono", monospace;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .target{
    font-family:"Azeret Mono", monospace;
    font-weight:700;
    font-size:clamp(58px,17vw,104px);
    line-height:.92;
    letter-spacing:-.04em;
    margin-top:10px;
    font-variant-numeric:tabular-nums;
  }
  .target .unit{
    font-family:"IBM Plex Sans KR",sans-serif;
    font-weight:500;
    font-size:.24em;
    letter-spacing:0;
    margin-left:.12em;
    color:var(--ink-soft);
  }
  .live{
    font-family:"Azeret Mono", monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:19px;
    font-variant-numeric:tabular-nums;
  }

  .verdict{
    margin-top:14px;
    min-height:44px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .error{
    font-family:"Azeret Mono", monospace;
    font-size:20px;font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .grade{
    font-size:11px;letter-spacing:.14em;
    padding:3px 10px;border-radius:999px;
    border:1px solid currentColor;
  }
  .hint{font-size:13px;color:var(--ink-soft)}

  /* ── pad ──────────────────────────────── */
  .pad{
    display:block;width:calc(100% - 44px);margin:4px 22px 20px;
    padding:15px;
    background:var(--ink);color:var(--paper);
    border:none;border-radius:3px;cursor:pointer;
    font-family:"Azeret Mono", monospace;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    transition:background .12s ease, transform .06s ease;
  }
  .pad:hover{background:#2C2320}
  .pad:active{transform:translateY(1px)}
  .pad:focus-visible{outline:2px solid var(--pen-bad);outline-offset:3px}
  .pad[disabled]{background:var(--edge);color:var(--ink-soft);cursor:default}

  /* ── chart strip ──────────────────────── */
  .strip-wrap{border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
  .strip-head{
    display:flex;justify-content:space-between;
    padding:9px 22px 0;
    font-family:"Azeret Mono", monospace;
    font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  }
  .strip{
    position:relative;height:168px;margin:8px 22px 14px;
    background-color:#FFFBF9;
    background-image:
      repeating-linear-gradient(to right, var(--grid-fine) 0 1px, transparent 1px 12px),
      repeating-linear-gradient(to bottom, var(--grid-fine) 0 1px, transparent 1px 12px),
      repeating-linear-gradient(to right, var(--grid-bold) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(to bottom, var(--grid-bold) 0 1px, transparent 1px 60px);
    border:1px solid var(--grid-bold);
    overflow:hidden;
  }
  .axis{
    position:absolute;left:0;right:0;top:50%;
    border-top:1.5px dashed rgba(23,18,15,.45);
  }
  .side{
    position:absolute;left:6px;
    font-family:"Azeret Mono", monospace;
    font-size:9px;letter-spacing:.14em;color:var(--ink-soft);
  }
  .side.up{top:6px}
  .side.down{bottom:6px}
  .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--ink-soft);
  }
  .mark{position:absolute;top:0;bottom:0;width:0}
  .stem{
    position:absolute;left:-1px;width:2px;background:var(--ink);opacity:.72;
  }
  .dot{
    position:absolute;left:-4px;width:8px;height:8px;border-radius:50%;
    background:var(--ink);
  }
  .mark.good .stem,.mark.good .dot{background:var(--pen-good)}
  .mark.bad .stem,.mark.bad .dot{background:var(--pen-bad)}
  .mark.fresh .dot{animation:stamp .28s cubic-bezier(.2,1.5,.4,1)}
  @keyframes stamp{from{transform:scale(2.4);opacity:.2}to{transform:scale(1);opacity:1}}

  /* ── stats ────────────────────────────── */
  .stats{display:grid;grid-template-columns:repeat(4,1fr)}
  .cell{padding:14px 10px;text-align:center;border-left:1px solid var(--edge)}
  .cell:first-child{border-left:none}
  .cell .k{
    font-family:"Azeret Mono",monospace;font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .cell .v{
    font-family:"Azeret Mono",monospace;font-size:19px;font-weight:500;margin-top:5px;
    font-variant-numeric:tabular-nums;
  }

  .foot{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 22px;border-top:1px solid var(--edge);
    font-size:12px;color:var(--ink-soft);
  }
  .foot label{display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .foot input{accent-color:var(--ink);cursor:pointer}
  .reset{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    font-family:"Azeret Mono",monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;
  }
  .reset:hover{color:var(--ink)}
  .bias{flex:1;text-align:center;font-size:11.5px}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .cell:nth-child(3){border-left:none}
    .cell:nth-child(n+3){border-top:1px solid var(--edge)}
    .strip{height:134px}
    .foot{flex-wrap:wrap;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<main class="machine">
  <div class="head">
    <span class="eyebrow">정밀 타이밍 측정기</span>
    <span class="rec" id="rec"><span class="bulb"></span>REC</span>
  </div>

  <section class="readout">
    <div class="kicker">목표 시간</div>
    <div class="target" id="target">—<span class="unit">초</span></div>
    <div class="live" id="live"></div>
    <div class="verdict" id="verdict">
      <div class="hint">스페이스를 눌러 시작하세요</div>
    </div>
  </section>

  <button class="pad" id="pad">시작</button>

  <div class="strip-wrap">
    <div class="strip-head"><span>측정 기록</span><span>오차 ±0.6초</span></div>
    <div class="strip" id="strip">
      <div class="side up">빠름</div>
      <div class="axis"></div>
      <div class="side down">늦음</div>
      <div class="empty" id="empty">첫 기록이 여기에 남습니다</div>
    </div>
  </div>

  <div class="stats">
    <div class="cell"><div class="k">시도</div><div class="v" id="s-count">0</div></div>
    <div class="cell"><div class="k">최고 정확도</div><div class="v" id="s-best">—</div></div>
    <div class="cell"><div class="k">평균 오차</div><div class="v" id="s-avg">—</div></div>
    <div class="cell"><div class="k">연속 적중</div><div class="v" id="s-streak">0</div></div>
  </div>

  <div class="foot">
    <label><input type="checkbox" id="show-timer">측정 중 시간 표시</label>
    <span class="bias" id="bias"></span>
    <button class="reset" id="reset">기록 지우기</button>
  </div>
</main>

<script>
(function(){
  const MAX_MARKS = 20, SCALE = 0.6, LOCKOUT = 650;
  // 저장은 최근 KEEP개만. 차트와 평균에만 쓰이므로 그 이상은 의미가 없고,
  // 무한히 쌓이면 localStorage 용량을 잠식한다. 누적 시도 횟수와 최고
  // 기록은 잘려도 남아야 하므로 따로 센다.
  const STORE_KEY = 'timing-game/v1', KEEP = 500;

  const $ = id => document.getElementById(id);
  const el = {
    target:$('target'), live:$('live'), verdict:$('verdict'), pad:$('pad'),
    rec:$('rec'), strip:$('strip'), empty:$('empty'), bias:$('bias'),
    count:$('s-count'), best:$('s-best'), avg:$('s-avg'), streak:$('s-streak'),
    showTimer:$('show-timer'), reset:$('reset')
  };

  let target = 0, startedAt = 0, state = 'idle', raf = 0;
  let results = [], streak = 0, total = 0, best = null;

  const fmt = n => n.toFixed(3);

  // ── 저장 ────────────────────────────────
  // 사파리 프라이빗 모드나 저장 공간이 꽉 찬 브라우저는 여기서 예외를
  // 던진다. 기록을 못 남기더라도 게임 자체는 계속돼야 한다.
  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v:1, results:results.slice(-KEEP), streak, total, best,
        showTimer: el.showTimer.checked
      }));
    } catch (e) { /* 저장 못 해도 진행 */ }
  }

  function load(){
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!saved || saved.v !== 1 || !Array.isArray(saved.results)) return;
      results = saved.results.filter(n => typeof n === 'number' && isFinite(n)).slice(-KEEP);
      streak  = Number.isFinite(saved.streak) ? saved.streak : 0;
      total   = Number.isFinite(saved.total)  ? saved.total  : results.length;
      best    = Number.isFinite(saved.best)   ? saved.best   : null;
      el.showTimer.checked = !!saved.showTimer;
    } catch (e) { /* 손상된 기록은 버리고 새로 시작 */ }
  }

  // ── 게임 ────────────────────────────────
  function newTarget(){
    let t;
    do { t = (Math.round(Math.random()*79) + 20) / 10; } while (t === target);
    target = t;
    el.target.innerHTML = target.toFixed(2) + '<span class="unit">초</span>';
  }

  function grade(abs){
    if (abs <= 0.030) return {name:'완벽',  color:'var(--pen-good)', pen:'good'};
    if (abs <= 0.100) return {name:'정밀',  color:'var(--ink)',      pen:''};
    if (abs <= 0.250) return {name:'근접',  color:'var(--ink-soft)', pen:''};
    if (abs <= 0.500) return {name:'빗나감',color:'var(--ink-soft)', pen:''};
    return {name:'실패', color:'var(--pen-bad)', pen:'bad'};
  }

  function toIdle(msg){
    state = 'idle';
    el.pad.disabled = false;
    el.pad.textContent = '시작';
    el.rec.classList.remove('live');
    el.live.textContent = '';
    if (msg) el.verdict.innerHTML = '<div class="hint">' + msg + '</div>';
  }

  function start(){
    state = 'running';
    startedAt = performance.now();
    el.pad.textContent = '정지';
    el.rec.classList.add('live');
    el.verdict.innerHTML = '<div class="hint">스페이스를 다시 눌러 정지</div>';
    tick();
  }

  function tick(){
    if (state !== 'running') return;
    el.live.textContent = el.showTimer.checked
      ? fmt((performance.now() - startedAt)/1000) + ' 초'
      : '측정 중';
    raf = requestAnimationFrame(tick);
  }

  function stop(){
    const elapsed = (performance.now() - startedAt)/1000;
    cancelAnimationFrame(raf);
    state = 'locked';
    el.rec.classList.remove('live');
    el.pad.disabled = true;
    el.pad.textContent = '다음 목표';
    el.live.textContent = fmt(elapsed) + ' 초 기록됨';

    const err = elapsed - target, abs = Math.abs(err), g = grade(abs);
    const dir = abs < 0.0005 ? '정확' : (err > 0 ? '늦음' : '빠름');
    el.verdict.innerHTML =
      '<div class="error" style="color:' + g.color + '">' +
        (err >= 0 ? '+' : '−') + fmt(abs) + '초 ' + dir +
      '</div>' +
      '<div class="grade" style="color:' + g.color + '">' + g.name + '</div>';

    results.push(err);
    if (results.length > KEEP) results = results.slice(-KEEP);
    total += 1;
    if (best === null || abs < best) best = abs;
    streak = abs <= 0.100 ? streak + 1 : 0;
    save();
    draw();
    render();

    setTimeout(function(){
      if (state !== 'locked') return;
      newTarget();
      toIdle('스페이스를 눌러 시작');
    }, LOCKOUT);
  }

  function draw(){
    el.strip.querySelectorAll('.mark').forEach(n => n.remove());
    const shown = results.slice(-MAX_MARKS);
    el.empty.style.display = shown.length ? 'none' : 'flex';

    shown.forEach(function(err, i){
      const x = (i + 0.5) / MAX_MARKS * 100;
      const clamped = Math.max(-SCALE, Math.min(SCALE, err));
      const y = 50 + (clamped / SCALE) * 46;   // 늦으면 아래로
      const abs = Math.abs(err), g = grade(abs);

      const mark = document.createElement('div');
      mark.className = 'mark ' + g.pen + (i === shown.length - 1 ? ' fresh' : '');
      mark.style.left = x + '%';

      const stem = document.createElement('div');
      stem.className = 'stem';
      stem.style.top    = Math.min(50, y) + '%';
      stem.style.height = Math.abs(y - 50) + '%';

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.top = 'calc(' + y + '% - 4px)';

      mark.append(stem, dot);
      el.strip.appendChild(mark);
    });
  }

  function render(){
    el.count.textContent = total;
    el.streak.textContent = streak;

    if (!results.length){
      el.best.textContent = el.avg.textContent = '—';
      el.bias.textContent = '';
      return;
    }
    const abs = results.map(Math.abs);
    el.best.textContent = best === null ? '—' : fmt(best);
    el.avg.textContent  = fmt(abs.reduce((a,b)=>a+b,0) / abs.length);

    const mean = results.reduce((a,b)=>a+b,0) / results.length;
    el.bias.textContent = results.length < 3 ? ''
      : Math.abs(mean) < 0.02 ? '편향 없이 고르게 누릅니다'
      : '평균 ' + Math.abs(mean).toFixed(2) + '초 ' + (mean > 0 ? '늦게' : '빠르게') + ' 누릅니다';
  }

  function press(){
    if (state === 'idle') start();
    else if (state === 'running') stop();
  }

  el.pad.addEventListener('click', press);

  document.addEventListener('keydown', function(e){
    if (e.code !== 'Space' && e.key !== ' ') return;
    e.preventDefault();
    if (e.repeat) return;
    press();
  });

  el.showTimer.addEventListener('change', save);

  el.reset.addEventListener('click', function(){
    results = []; streak = 0; total = 0; best = null;
    cancelAnimationFrame(raf);
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ }
    draw(); render();
    newTarget();
    toIdle('스페이스를 눌러 시작');
    el.pad.focus();
  });

  load();
  newTarget();
  draw();
  render();
})();
</script>
</body>
</html>
